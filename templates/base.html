<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}User Manager{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f4f4f4; }
        form { margin-top: 20px; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="number"] { padding: 6px; width: 300px; }
        button { margin-top: 15px; padding: 8px 16px; cursor: pointer; }
        .message { padding: 10px; background: #ffeeba; border: 1px solid #ffc107; margin-top: 15px; }
        .success { background: #d4edda; border-color: #28a745; }
        .error { background: #f8d7da; border-color: #dc3545; }
        .actions a { margin-right: 10px; color: #0066cc; }
    </style>
</head>
<body>
    <nav>
        <a href="/user/page">Все пользователи</a>
        <a href="/user/page/create">Создать пользователя</a>
    </nav>
    <hr>
    <h1>{% block header %}{% endblock %}</h1>
    {% block content %}{% endblock %}
</body>
</html>
