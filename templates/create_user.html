{% extends "base.html" %}

{% block title %}Создание пользователя{% endblock %}
{% block header %}Создание пользователя{% endblock %}

{% block content %}
    {% if message %}
        <div class="message {{ 'success' if not error else 'error' }}">{{ message }}</div>
    {% endif %}

    <form method="post" action="/user/page/create">
        <label for="id">ID пользователя:</label>
        <input type="number" name="id" id="id" required value="{{ form.id or '' }}">

        <label for="item">Урок:</label>
        <input type="text" name="item" id="item" required value="{{ form.item or '' }}">

        <label for="status">Статус:</label>
        <input type="text" name="status" id="status" required value="{{ form.status or '' }}">

        <button type="submit">Создать</button>
    </form>

    <p><a href="/user/page">← Назад к списку</a></p>
{% endblock %}
